<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Device Control Screen</title>
<!-- Google Fonts: Space Grotesk & Material Symbols -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "surface-dark": "#1c2630",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-white antialiased selection:bg-primary selection:text-white">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark border-x dark:border-slate-800">
<!-- TopAppBar -->
<div class="flex items-center px-4 py-4 justify-between sticky top-0 z-50 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm">
<div class="flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors cursor-pointer text-slate-900 dark:text-white">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<div class="flex flex-col items-center">
<h2 class="text-lg font-bold leading-tight tracking-tight">Smart AC</h2>
<div class="flex items-center gap-1.5 mt-0.5">
<div class="size-1.5 rounded-full bg-green-500 animate-pulse"></div>
<span class="text-xs font-medium text-slate-500 dark:text-slate-400">Connected</span>
</div>
</div>
<div class="flex w-10 items-center justify-end">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors cursor-pointer text-slate-900 dark:text-white">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</div>
<!-- Scrollable Content -->
<div class="flex-1 flex flex-col gap-6 p-4 pb-8">
<!-- Hero Status Card -->
<div class="relative overflow-hidden rounded-2xl bg-surface-light dark:bg-surface-dark shadow-sm ring-1 ring-slate-200 dark:ring-slate-800">
<!-- Background Image/Gradient -->
<div class="absolute inset-0 bg-gradient-to-br from-primary/20 to-transparent dark:from-primary/10 dark:to-transparent z-0"></div>
<div class="absolute right-[-20px] top-[-20px] opacity-20 dark:opacity-10 rotate-12 z-0">
<span class="material-symbols-outlined text-[180px] text-primary">mode_fan</span>
</div>
<div class="relative z-10 p-6 flex flex-col items-center justify-center gap-2 py-10">
<div class="flex items-start gap-1">
<span class="text-7xl font-bold tracking-tighter text-slate-900 dark:text-white">24</span>
<span class="text-3xl font-medium text-slate-500 dark:text-slate-400 mt-2">°C</span>
</div>
<p class="text-sm font-medium text-primary bg-primary/10 px-3 py-1 rounded-full">Cooling Mode</p>
<div class="flex items-center gap-6 mt-4 w-full justify-center">
<div class="flex flex-col items-center gap-1">
<span class="text-xs text-slate-500 dark:text-slate-400">Humidity</span>
<span class="text-sm font-semibold">45%</span>
</div>
<div class="w-px h-8 bg-slate-200 dark:bg-slate-700"></div>
<div class="flex flex-col items-center gap-1">
<span class="text-xs text-slate-500 dark:text-slate-400">Fan Speed</span>
<span class="text-sm font-semibold">Auto</span>
</div>
</div>
</div>
</div>
<!-- Main Actions (Power & Modes) -->
<div class="grid grid-cols-4 gap-3">
<!-- Power Button (Takes 1 column) -->
<button class="col-span-1 flex flex-col items-center justify-center gap-2 rounded-xl bg-primary text-white p-3 shadow-lg shadow-primary/25 hover:bg-primary/90 transition-all active:scale-95">
<span class="material-symbols-outlined text-2xl">power_settings_new</span>
<span class="text-[10px] font-bold uppercase tracking-wider">On</span>
</button>
<!-- Mode Selection (Takes 3 columns) -->
<div class="col-span-3 flex rounded-xl bg-surface-light dark:bg-surface-dark p-1.5 ring-1 ring-slate-200 dark:ring-slate-800">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="mode" type="radio" value="cool"/>
<div class="flex h-full w-full flex-col items-center justify-center rounded-lg py-2 text-slate-500 dark:text-slate-400 peer-checked:bg-slate-100 dark:peer-checked:bg-slate-700 peer-checked:text-primary transition-all">
<span class="material-symbols-outlined text-xl mb-0.5">ac_unit</span>
<span class="text-[10px] font-medium">Cool</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="mode" type="radio" value="dry"/>
<div class="flex h-full w-full flex-col items-center justify-center rounded-lg py-2 text-slate-500 dark:text-slate-400 peer-checked:bg-slate-100 dark:peer-checked:bg-slate-700 peer-checked:text-primary transition-all">
<span class="material-symbols-outlined text-xl mb-0.5">water_drop</span>
<span class="text-[10px] font-medium">Dry</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="mode" type="radio" value="fan"/>
<div class="flex h-full w-full flex-col items-center justify-center rounded-lg py-2 text-slate-500 dark:text-slate-400 peer-checked:bg-slate-100 dark:peer-checked:bg-slate-700 peer-checked:text-primary transition-all">
<span class="material-symbols-outlined text-xl mb-0.5">air</span>
<span class="text-[10px] font-medium">Fan</span>
</div>
</label>
</div>
</div>
<!-- Temperature Slider -->
<div class="rounded-2xl bg-surface-light dark:bg-surface-dark p-5 ring-1 ring-slate-200 dark:ring-slate-800">
<div class="flex w-full items-center justify-between mb-4">
<p class="text-base font-bold">Target Temperature</p>
<p class="text-lg font-bold text-primary">24°C</p>
</div>
<div class="relative flex h-8 w-full items-center">
<!-- Track Background -->
<div class="absolute w-full h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
<!-- Active Track -->
<div class="h-full w-[60%] bg-primary rounded-full"></div>
</div>
<!-- Thumb (positioned absolutely) -->
<div class="absolute left-[60%] -translate-x-1/2 flex items-center justify-center size-8 bg-white rounded-full shadow-md border-2 border-primary cursor-pointer hover:scale-110 transition-transform">
<div class="size-2 bg-primary rounded-full"></div>
</div>
</div>
<div class="flex justify-between mt-2 text-xs font-medium text-slate-400">
<span>16°C</span>
<span>30°C</span>
</div>
</div>
<!-- Additional Controls (Quick Actions) -->
<div class="grid grid-cols-2 gap-3">
<div class="rounded-2xl bg-surface-light dark:bg-surface-dark p-4 ring-1 ring-slate-200 dark:ring-slate-800 flex items-center justify-between group cursor-pointer hover:ring-primary/50 transition-all">
<div class="flex flex-col gap-1">
<span class="text-sm font-medium text-slate-500 dark:text-slate-400">Timer</span>
<span class="text-lg font-bold group-hover:text-primary transition-colors">2h 30m</span>
</div>
<div class="rounded-full bg-slate-100 dark:bg-slate-800 p-2 text-slate-900 dark:text-white group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">timer</span>
</div>
</div>
<div class="rounded-2xl bg-surface-light dark:bg-surface-dark p-4 ring-1 ring-slate-200 dark:ring-slate-800 flex items-center justify-between group cursor-pointer hover:ring-primary/50 transition-all">
<div class="flex flex-col gap-1">
<span class="text-sm font-medium text-slate-500 dark:text-slate-400">Swing</span>
<span class="text-lg font-bold group-hover:text-primary transition-colors">Vertical</span>
</div>
<div class="rounded-full bg-slate-100 dark:bg-slate-800 p-2 text-slate-900 dark:text-white group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-xl">compare_arrows</span>
</div>
</div>
</div>
<!-- Historical Data -->
<div class="rounded-2xl bg-surface-light dark:bg-surface-dark p-5 ring-1 ring-slate-200 dark:ring-slate-800">
<div class="flex items-center justify-between mb-4">
<h3 class="font-bold">Energy Usage</h3>
<select class="bg-transparent text-xs font-medium text-slate-500 dark:text-slate-400 border-none outline-none cursor-pointer hover:text-primary">
<option>Last 24 Hours</option>
<option>Last Week</option>
</select>
</div>
<!-- Chart Container -->
<div class="flex items-end justify-between h-32 gap-2 mt-2 px-1">
<!-- Bar 1 -->
<div class="flex flex-col items-center gap-2 flex-1 group">
<div class="w-full bg-primary/20 dark:bg-primary/10 rounded-t-sm relative group-hover:bg-primary/30 transition-all h-[40%]">
<div class="absolute bottom-0 w-full bg-primary rounded-t-sm h-full opacity-80 group-hover:opacity-100 transition-opacity"></div>
</div>
<span class="text-[10px] text-slate-400">12am</span>
</div>
<!-- Bar 2 -->
<div class="flex flex-col items-center gap-2 flex-1 group">
<div class="w-full bg-primary/20 dark:bg-primary/10 rounded-t-sm relative group-hover:bg-primary/30 transition-all h-[60%]">
<div class="absolute bottom-0 w-full bg-primary rounded-t-sm h-full opacity-80 group-hover:opacity-100 transition-opacity"></div>
</div>
<span class="text-[10px] text-slate-400">4am</span>
</div>
<!-- Bar 3 -->
<div class="flex flex-col items-center gap-2 flex-1 group">
<div class="w-full bg-primary/20 dark:bg-primary/10 rounded-t-sm relative group-hover:bg-primary/30 transition-all h-[30%]">
<div class="absolute bottom-0 w-full bg-primary rounded-t-sm h-full opacity-80 group-hover:opacity-100 transition-opacity"></div>
</div>
<span class="text-[10px] text-slate-400">8am</span>
</div>
<!-- Bar 4 -->
<div class="flex flex-col items-center gap-2 flex-1 group">
<div class="w-full bg-primary/20 dark:bg-primary/10 rounded-t-sm relative group-hover:bg-primary/30 transition-all h-[85%]">
<div class="absolute bottom-0 w-full bg-primary rounded-t-sm h-full opacity-80 group-hover:opacity-100 transition-opacity"></div>
</div>
<span class="text-[10px] text-slate-400 font-bold text-primary">12pm</span>
</div>
<!-- Bar 5 -->
<div class="flex flex-col items-center gap-2 flex-1 group">
<div class="w-full bg-primary/20 dark:bg-primary/10 rounded-t-sm relative group-hover:bg-primary/30 transition-all h-[55%]">
<div class="absolute bottom-0 w-full bg-primary rounded-t-sm h-full opacity-80 group-hover:opacity-100 transition-opacity"></div>
</div>
<span class="text-[10px] text-slate-400">4pm</span>
</div>
<!-- Bar 6 -->
<div class="flex flex-col items-center gap-2 flex-1 group">
<div class="w-full bg-primary/20 dark:bg-primary/10 rounded-t-sm relative group-hover:bg-primary/30 transition-all h-[70%]">
<div class="absolute bottom-0 w-full bg-primary rounded-t-sm h-full opacity-80 group-hover:opacity-100 transition-opacity"></div>
</div>
<span class="text-[10px] text-slate-400">8pm</span>
</div>
</div>
<div class="mt-4 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 px-1 border-t border-slate-100 dark:border-slate-800 pt-3">
<span>Total Usage</span>
<span class="font-bold text-slate-900 dark:text-white">4.2 kWh</span>
</div>
</div>
</div>
</div>
</body></html>
