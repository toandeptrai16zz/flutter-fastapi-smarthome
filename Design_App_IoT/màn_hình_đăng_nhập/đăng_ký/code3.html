<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AIoT Login</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&amp;family=Noto+Sans:wght@300;400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#137fec",
              "background-light": "#f6f7f8",
              "background-dark": "#101922",
              "surface-dark": "#1c2630", // Slightly lighter for inputs/cards
              "text-secondary": "#9dabb9",
            },
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"],
              "body": ["Noto Sans", "sans-serif"],
            },
            borderRadius: {
              "DEFAULT": "0.25rem", 
              "lg": "0.5rem", 
              "xl": "0.75rem", 
              "full": "9999px"
            },
          },
        },
      }
    </script>
<style>
        body {
            font-family: "Space Grotesk", "Noto Sans", sans-serif;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #101922;
        }
        ::-webkit-scrollbar-thumb {
            background: #283039; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3e4a56; 
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white transition-colors duration-200">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden font-display">
<!-- Top App Bar -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="text-slate-900 dark:text-white flex size-12 shrink-0 items-center justify-center cursor-pointer hover:bg-black/5 dark:hover:bg-white/10 rounded-full transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Smart Control</h2>
</div>
<!-- Scrollable Content -->
<div class="flex-1 flex flex-col px-4 max-w-md mx-auto w-full pb-8">
<!-- Hero / Welcome -->
<div class="flex flex-col items-center pt-6 pb-4">
<!-- Logo Placeholder -->
<div class="w-16 h-16 bg-primary/20 rounded-2xl flex items-center justify-center mb-4 text-primary">
<span class="material-symbols-outlined text-[32px]">hub</span>
</div>
<h1 class="text-slate-900 dark:text-white tracking-tight text-[32px] font-bold leading-tight text-center">Welcome Back</h1>
<p class="text-text-secondary text-base font-normal leading-normal pt-2 text-center max-w-xs">Manage your AIoT devices securely from anywhere.</p>
</div>
<!-- Segmented Buttons (Login/Signup Toggle) -->
<div class="py-4">
<div class="flex h-12 w-full items-center justify-center rounded-xl bg-gray-200 dark:bg-[#1c2630] p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-[#2c3b4a] has-[:checked]:shadow-sm has-[:checked]:text-primary text-gray-500 dark:text-text-secondary transition-all duration-200">
<span class="truncate text-sm font-bold leading-normal">Log In</span>
<input checked="" class="invisible w-0" name="auth_type" type="radio" value="Log In"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white dark:has-[:checked]:bg-[#2c3b4a] has-[:checked]:shadow-sm has-[:checked]:text-primary text-gray-500 dark:text-text-secondary transition-all duration-200">
<span class="truncate text-sm font-bold leading-normal">Sign Up</span>
<input class="invisible w-0" name="auth_type" type="radio" value="Sign Up"/>
</label>
</div>
</div>
<!-- Form -->
<form class="flex flex-col gap-4 mt-2">
<!-- Email Input -->
<div class="space-y-1">
<label class="text-sm font-medium text-slate-700 dark:text-gray-300 ml-1">Email or Phone</label>
<div class="relative flex items-center h-14 rounded-xl bg-gray-100 dark:bg-[#1c2630] border border-transparent focus-within:border-primary/50 focus-within:ring-1 focus-within:ring-primary/50 transition-all overflow-hidden">
<div class="pl-4 text-text-secondary">
<span class="material-symbols-outlined">mail</span>
</div>
<input class="w-full h-full bg-transparent border-none text-slate-900 dark:text-white placeholder-text-secondary px-3 focus:ring-0 text-base" placeholder="user@example.com" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1">
<label class="text-sm font-medium text-slate-700 dark:text-gray-300 ml-1">Password</label>
<div class="relative flex items-center h-14 rounded-xl bg-gray-100 dark:bg-[#1c2630] border border-transparent focus-within:border-primary/50 focus-within:ring-1 focus-within:ring-primary/50 transition-all overflow-hidden">
<div class="pl-4 text-text-secondary">
<span class="material-symbols-outlined">lock</span>
</div>
<input class="w-full h-full bg-transparent border-none text-slate-900 dark:text-white placeholder-text-secondary px-3 focus:ring-0 text-base" placeholder="Enter your password" type="password"/>
<button class="pr-4 text-text-secondary hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end">
<a class="text-sm font-medium text-primary hover:text-primary/80 transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Primary Button -->
<button class="w-full h-12 mt-2 bg-primary hover:bg-blue-600 active:bg-blue-700 text-white font-bold rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg shadow-primary/20">
<span>Log In</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative py-8 flex items-center">
<div class="flex-grow border-t border-gray-300 dark:border-gray-700"></div>
<span class="flex-shrink-0 mx-4 text-text-secondary text-sm">Or continue with</span>
<div class="flex-grow border-t border-gray-300 dark:border-gray-700"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="h-12 flex items-center justify-center gap-3 bg-gray-100 dark:bg-[#1c2630] hover:bg-gray-200 dark:hover:bg-[#2c3b4a] rounded-xl transition-colors border border-transparent dark:border-gray-800">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-slate-900 dark:text-white font-medium text-sm">Google</span>
</button>
<button class="h-12 flex items-center justify-center gap-3 bg-gray-100 dark:bg-[#1c2630] hover:bg-gray-200 dark:hover:bg-[#2c3b4a] rounded-xl transition-colors border border-transparent dark:border-gray-800">
<svg class="w-5 h-5 text-black dark:text-white" fill="currentColor" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.1 1.88-2.58 5.76.53 7.02-.63 1.61-1.55 3.19-2.58 4.19zm-3.3-15.68c.67-1.2 2.09-2.05 3.8-2.12.24 1.66-.82 3.25-1.89 3.96-1.02.66-2.43.89-3.74.8-.2-1.63.96-2.92 1.83-2.64z"></path>
</svg>
<span class="text-slate-900 dark:text-white font-medium text-sm">Apple</span>
</button>
</div>
<!-- Footer Biometrics -->
<div class="mt-8 flex flex-col items-center justify-center gap-4">
<button class="flex flex-col items-center justify-center text-primary/70 hover:text-primary transition-colors group">
<span class="material-symbols-outlined text-[40px] group-hover:scale-110 transition-transform duration-200">face</span>
<span class="text-xs font-medium mt-1">Face ID</span>
</button>
</div>
</div>
<!-- Bottom safe area spacer -->
<div class="h-6 w-full bg-background-light dark:bg-background-dark"></div>
</div>
</body></html>
